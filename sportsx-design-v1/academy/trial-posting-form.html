<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Post New Trial - SportX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }
    .status-bar { height: 44px; padding-top: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding-left: 24px; padding-right: 24px; font-size: 14px; font-weight: 600; }
    .status-icons { display: flex; gap: 4px; align-items: center; }
    .status-icons svg { width: 16px; height: 16px; }
    .header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 18px; font-weight: 600; }
    .back-btn { width: 40px; height: 40px; border-radius: var(--radius); border: none; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .back-btn svg { width: 18px; height: 18px; }
    .main-content { flex: 1; padding: 20px; overflow-y: auto; }
    .form-section { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .form-section:last-child { border-bottom: none; }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-family: inherit; background: var(--bg); color: var(--fg); }
    .form-group textarea { resize: none; height: 80px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }
    .eligibility-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; background: var(--bg); cursor: pointer; }
    .chip.selected { background: var(--accent); color: white; border-color: var(--accent); }
    .doc-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .doc-item:last-child { border-bottom: none; }
    .doc-item span { font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .doc-item span svg { width: 16px; height: 16px; }
    .toggle { width: 40px; height: 24px; background: var(--accent); border-radius: 12px; position: relative; cursor: pointer; border: none; }
    .toggle::after { content: ''; position: absolute; width: 20px; height: 20px; background: white; border-radius: 50%; top: 2px; left: 18px; }
    .toggle.off { background: var(--border); }
    .toggle.off::after { left: 2px; }
    .cta-bar { padding: 16px 20px; padding-bottom: calc(16px + var(--safe-bottom)); border-top: 1px solid var(--border); display: flex; gap: 12px; background: var(--bg); }
    .btn-secondary { flex: 1; padding: 14px; background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-primary { flex: 1; padding: 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <i data-lucide="wifi"></i>
      <i data-lucide="radio"></i>
      <i data-lucide="battery-full"></i>
    </div>
  </div>
  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <i data-lucide="arrow-left"></i>
    </button>
    <h1>Post New Trial</h1>
  </div>
  <div class="main-content">
    <div class="form-section">
      <div class="section-title">Trial Details</div>
      <div class="form-group"><label>Trial Title</label><input type="text" placeholder="e.g., Open Football Trials - December 2024"></div>
      <div class="row">
        <div class="form-group"><label>Sport</label><select><option>Football</option><option>Basketball</option><option>Athletics</option></select></div>
        <div class="form-group"><label>Entry Fee</label><input type="text" placeholder="₹0 if free" value="₹200"></div>
      </div>
      <div class="row">
        <div class="form-group"><label>Date</label><input type="date" value="2024-12-10"></div>
        <div class="form-group"><label>Time</label><input type="text" placeholder="e.g., 8:00 AM - 12:00 PM" value="8:00 AM - 12:00 PM"></div>
      </div>
      <div class="form-group"><label>Venue</label><input type="text" value="Sreekanya Academy Ground, Indiranagar"></div>
      <div class="form-group"><label>Description</label><textarea placeholder="Describe the trial format, what you're looking for..."></textarea></div>
    </div>
    <div class="form-section">
      <div class="section-title">Eligibility</div>
      <div class="form-group">
        <label>Age Groups</label>
        <div class="eligibility-chips">
          <div class="chip selected">U-10</div>
          <div class="chip selected">U-14</div>
          <div class="chip selected">U-16</div>
          <div class="chip">U-18</div>
          <div class="chip">Open</div>
        </div>
      </div>
      <div class="form-group"><label>Maximum Registrations</label><input type="number" value="50"></div>
    </div>
    <div class="form-section">
      <div class="section-title">Required Documents</div>
      <div class="doc-item"><span><i data-lucide="file-text"></i> Age Proof</span><button class="toggle"></button></div>
      <div class="doc-item"><span><i data-lucide="file-text"></i> Previous Team/Club Certificate</span><button class="toggle"></button></div>
      <div class="doc-item"><span><i data-lucide="file-text"></i> Medical Fitness Certificate</span><button class="toggle off"></button></div>
      <div class="doc-item"><span><i data-lucide="file-text"></i> Parent Consent Form</span><button class="toggle"></button></div>
    </div>
  </div>
  <div class="cta-bar">
    <button class="btn-secondary">Save as Draft</button>
    <button class="btn-primary" onclick="location.href='my-trials.html'">Publish Trial</button>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
