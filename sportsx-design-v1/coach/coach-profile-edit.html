<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edit Coach Profile - SportX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }
    .status-bar { height: 44px; padding-top: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding-left: 24px; padding-right: 24px; font-size: 14px; font-weight: 600; }
    .status-icons { display: flex; gap: 4px; align-items: center; }
    .status-icons svg { width: 16px; height: 16px; }
    .header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 18px; font-weight: 600; }
    .back-btn { width: 40px; height: 40px; border-radius: var(--radius); border: none; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .back-btn svg { width: 18px; height: 18px; }
    .save-btn { margin-left: auto; padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .main-content { flex: 1; padding: 20px; overflow-y: auto; }
    .profile-photo { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .photo-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; }
    .photo-btn { padding: 10px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; }
    .photo-btn svg { width: 16px; height: 16px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-family: inherit; background: var(--bg); color: var(--fg); }
    .form-group textarea { resize: none; height: 80px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }
    .fee-structure { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .fee-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .fee-row:last-child { border-bottom: none; }
    .fee-label { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .fee-label svg { width: 14px; height: 14px; }
    .fee-value { font-size: 14px; font-weight: 600; }
    .section-title { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 12px; margin-top: 20px; }
    .availability-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .day-label { font-size: 11px; color: var(--muted); padding: 4px; }
    .time-slot { padding: 8px 4px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; background: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .time-slot.selected { background: var(--accent); color: white; border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <i data-lucide="wifi"></i>
      <i data-lucide="radio"></i>
      <i data-lucide="battery-full"></i>
    </div>
  </div>
  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <i data-lucide="arrow-left"></i>
    </button>
    <h1>Edit Coach Profile</h1>
    <button class="save-btn" onclick="location.href='coach-dashboard.html'">Save</button>
  </div>
  <div class="main-content">
    <div class="profile-photo">
      <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=160&h=160&fit=crop" alt="Coach" class="photo-avatar">
      <button class="photo-btn"><i data-lucide="image"></i> Change Photo</button>
    </div>
    <div class="row">
      <div class="form-group"><label>First Name</label><input type="text" value="Raj"></div>
      <div class="form-group"><label>Last Name</label><input type="text" value="Kapoor"></div>
    </div>
    <div class="form-group"><label>Headline</label><input type="text" value="Professional Football Coach | AIFF C License"></div>
    <div class="form-group"><label>City</label><input type="text" value="Bangalore"></div>
    <div class="form-group"><label>Location/Area</label><input type="text" value="Indiranagar, Bangalore"></div>
    <div class="form-group"><label>Experience</label><select><option>1-3 years</option><option>3-5 years</option><option selected>5-10 years</option><option>10+ years</option></select></div>
    <div class="section-title">Fee Structure</div>
    <div class="fee-structure">
      <div class="fee-row"><span class="fee-label"><i data-lucide="circle-dot"></i> Per Session (90 min)</span><span class="fee-value">₹800</span></div>
      <div class="fee-row"><span class="fee-label"><i data-lucide="circle-dot"></i> Monthly (8 sessions)</span><span class="fee-value">₹5,000</span></div>
      <div class="fee-row"><span class="fee-label"><i data-lucide="circle-dot"></i> Quarterly (24 sessions)</span><span class="fee-value">₹13,000</span></div>
    </div>
    <div class="form-group"><label>Bio</label><textarea>12+ years of coaching experience with AIFF C License certification. Specializing in youth development and technical skill building. Former state-level player with a passion for nurturing young talent.</textarea></div>
    <div class="section-title">Weekly Availability</div>
    <div class="availability-grid">
      <div class="day-label">Mon</div><div class="day-label">Tue</div><div class="day-label">Wed</div><div class="day-label">Thu</div><div class="day-label">Fri</div><div class="day-label">Sat</div><div class="day-label">Sun</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px;">
      <div class="time-slot selected">4-6 PM</div>
      <div class="time-slot selected">4-6 PM</div>
      <div class="time-slot selected">4-6 PM</div>
      <div class="time-slot"></div>
      <div class="time-slot selected">4-6 PM</div>
      <div class="time-slot selected">10-12 PM</div>
      <div class="time-slot selected">10-12 PM</div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
