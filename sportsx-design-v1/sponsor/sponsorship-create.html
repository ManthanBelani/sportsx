<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportX India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }
    .status-bar { height: 44px; padding-top: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding-left: 24px; padding-right: 24px; font-size: 14px; font-weight: 600; }
    .header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 18px; font-weight: 600; }
    .back-btn { width: 40px; height: 40px; border-radius: var(--radius); border: none; background: var(--surface); cursor: pointer; font-size: 18px; }
    .main-content { flex: 1; padding: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-family: inherit; background: var(--bg); }
    .form-group textarea { resize: none; height: 80px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }
    .category-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; background: var(--bg); cursor: pointer; }
    .chip.selected { background: var(--accent); color: white; border-color: var(--accent); }
    .benefit-item { display: flex; gap: 8px; margin-bottom: 8px; }
    .benefit-item input { flex: 1; }
    .benefit-item button { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); cursor: pointer; }
    .add-benefit { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 14px; font-weight: 500; cursor: pointer; padding: 8px 0; }
    .cta-bar { padding: 16px 20px; padding-bottom: calc(16px + var(--safe-bottom)); border-top: 1px solid var(--border); display: flex; gap: 12px; }
    .btn-secondary { flex: 1; padding: 14px; background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { flex: 1; padding: 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span>📶 📡 🔋</span></div>
  <div class="header"><button class="back-btn" onclick="history.back()">←</button><h1>Create Sponsorship</h1></div>
  <div class="main-content">
    <div class="form-group"><label>Opportunity Title</label><input type="text" value="Emerging Athletes Program 2025"></div>
    <div class="form-group">
      <label>Sports</label>
      <div class="category-chips">
        <div class="chip selected">Football</div>
        <div class="chip selected">Athletics</div>
        <div class="chip">Basketball</div>
        <div class="chip">Cricket</div>
      </div>
    </div>
    <div class="row">
      <div class="form-group"><label>Grant Amount</label><input type="text" value="₹50,000"></div>
      <div class="form-group"><label>Deadline</label><input type="date" value="2025-01-15"></div>
    </div>
    <div class="form-group">
      <label>Eligibility Criteria</label>
      <textarea placeholder="Age range, income criteria, skill level...">Age 12-20 years • Active competitor at district or state level • Annual family income below ₹8 lakhs • No existing major sponsorship</textarea>
    </div>
    <div class="form-group">
      <label>Benefits Offered</label>
      <div class="benefit-item"><input type="text" value="₹50,000 monetary grant"><button>×</button></div>
      <div class="benefit-item"><input type="text" value="Complete Nike footwear and apparel kit"><button>×</button></div>
      <div class="benefit-item"><input type="text" value="3-month mentorship program"><button>×</button></div>
      <div class="add-benefit">+ Add Benefit</div>
    </div>
  </div>
  <div class="cta-bar">
    <button class="btn-secondary">Save Draft</button>
    <button class="btn-primary">Publish Listing</button>
  </div>
</body>
</html>
