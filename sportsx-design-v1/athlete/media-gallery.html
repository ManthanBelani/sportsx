<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportX India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 44px;
      padding-top: var(--safe-top);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 24px;
      padding-right: 24px;
      font-size: 14px;
      font-weight: 600;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      border: none;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .main-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--fg);
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-bottom: 16px;
    }
    .media-item {
      aspect-ratio: 1;
      background: var(--surface);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .media-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .media-item.video::after {
      content: '▶';
      position: absolute;
      font-size: 20px;
      color: white;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }
    .upload-btn {
      width: 100%;
      height: 100%;
      min-height: 100px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    .upload-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .info-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .info-card p {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      background: var(--bg);
    }
    .tab {
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }
    .empty-state svg { color: var(--muted); margin-bottom: 12px; }
    .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .empty-state p { font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 📡 🔋</span>
  </div>
  <div class="header">
    <button class="icon-btn" onclick="history.back()">←</button>
    <h1>Media Gallery</h1>
    <button class="icon-btn">✓</button>
  </div>
  <div class="tab-bar">
    <div class="tab active">Photos (24)</div>
    <div class="tab">Videos (3)</div>
    <div class="tab">Achievements (8)</div>
  </div>
  <div class="main-content">
    <div class="media-grid">
      <div class="media-item"><img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?w=300&h=300&fit=crop" alt="Training session"></div>
      <div class="media-item"><img src="https://images.unsplash.com/photo-1461896836934- voices-0c70ed8b1e22?w=300&h=300&fit=crop" alt="Match"></div>
      <div class="media-item video"><img src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=300&h=300&fit=crop" alt="Video"></div>
      <div class="media-item"><img src="https://images.unsplash.com/photo-1535131749006-b7f58c99034b?w=300&h=300&fit=crop" alt="Training"></div>
      <div class="media-item"><img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=300&h=300&fit=crop" alt="Match"></div>
      <div class="media-item"><img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=300&h=300&fit=crop" alt="Training"></div>
      <div class="media-item"><img src="https://images.unsplash.com/photo-1547347298-4074fc3086f0?w=300&h=300&fit=crop" alt="Trophy"></div>
      <div class="media-item"><img src="https://images.unsplash.com/photo-1526232761682-d26e03ac148e?w=300&h=300&fit=crop" alt="Medal ceremony"></div>
      <div class="media-item video"><img src="https://images.unsplash.com/photo-1599058917212-d750089bc07e?w=300&h=300&fit=crop" alt="Video"></div>
      <div class="media-item"><button class="upload-btn">+ Add</button></div>
    </div>
    <div class="info-card">
      <strong>Tips for a great gallery</strong>
      <p>Add photos and videos of your training, matches, and achievements. Profile with media get 3x more enquiries.</p>
    </div>
  </div>
</body>
</html>
