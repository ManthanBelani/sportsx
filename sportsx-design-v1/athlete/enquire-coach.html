<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportX India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 44px;
      padding-top: var(--safe-top);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 24px;
      padding-right: 24px;
      font-size: 14px;
      font-weight: 600;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 {
      font-size: 18px;
      font-weight: 600;
    }
    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      cursor: pointer;
      font-size: 18px;
    }
    .modal-body {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .coach-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 20px;
    }
    .coach-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
    }
    .coach-details h3 { font-size: 16px; font-weight: 600; }
    .coach-details p { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
    }
    .form-group textarea {
      resize: none;
      height: 120px;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .preferred-slots {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slot-row {
      display: flex;
      gap: 8px;
    }
    .slot-row input { flex: 1; }
    .modal-footer {
      padding: 16px 20px;
      padding-bottom: calc(16px + var(--safe-bottom));
      border-top: 1px solid var(--border);
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 📡 🔋</span>
  </div>
  <div class="modal-header">
    <h2>Enquire with Coach</h2>
    <button class="close-btn" onclick="history.back()">×</button>
  </div>
  <div class="modal-body">
    <div class="coach-info">
      <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=112&h=112&fit=crop" alt="Coach Raj" class="coach-avatar">
      <div class="coach-details">
        <h3>Raj Kapoor</h3>
        <p>Football Coach • 12 years exp • ₹5,000/month</p>
      </div>
    </div>
    <div class="form-group">
      <label>Your Message</label>
      <textarea placeholder="Hi Raj, I'm a 14-year-old footballer looking to improve my striking and dribbling skills. I'm available on weekends and Wednesday evenings..."></textarea>
    </div>
    <div class="form-group">
      <label>Preferred Training Days</label>
      <div class="preferred-slots">
        <div class="slot-row">
          <input type="text" placeholder="Day 1 (e.g., Saturday)" value="Saturday">
          <input type="text" placeholder="Time (e.g., 4-6 PM)" value="4:00 – 6:00 PM">
        </div>
        <div class="slot-row">
          <input type="text" placeholder="Day 2 (e.g., Sunday)" value="Sunday">
          <input type="text" placeholder="Time (e.g., 10-12 PM)" value="10:00 – 12:00 PM">
        </div>
        <div class="slot-row">
          <input type="text" placeholder="Day 3 (optional)">
          <input type="text" placeholder="Time">
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Your Age</label>
      <select>
        <option>14 years</option>
        <option>13 years</option>
        <option>15 years</option>
      </select>
    </div>
    <div class="form-group">
      <label>Contact Number</label>
      <input type="tel" placeholder="+91 98765 43210" value="+91 98765 43210">
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-primary" onclick="alert('Enquiry sent successfully!')">Send Enquiry</button>
  </div>
</body>
</html>
