<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportX India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      height: 44px;
      padding-top: var(--safe-top);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 24px;
      padding-right: 24px;
      font-size: 14px;
      font-weight: 600;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      border: none;
      background: var(--surface);
      cursor: pointer;
      font-size: 18px;
    }
    .main-content { flex: 1; padding: 20px; overflow-y: auto; }
    .form-section {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .form-section:last-child { border-bottom: none; }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
    }
    .form-group textarea { resize: none; height: 80px; }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .category-select {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .category-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
    }
    .category-option.selected {
      border-color: var(--accent);
      background: #dbeafe;
    }
    .category-option input[type="radio"] { display: none; }
    .fee-note {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px;
      font-size: 13px;
      color: var(--muted);
      margin-top: 12px;
    }
    .cta-bar {
      padding: 16px 20px;
      padding-bottom: calc(16px + var(--safe-bottom));
      border-top: 1px solid var(--border);
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span>📶 📡 🔋</span></div>
  <div class="header">
    <button class="back-btn" onclick="history.back()">←</button>
    <h1>Register for Tournament</h1>
  </div>
  <div class="main-content">
    <div class="form-section">
      <div class="section-title">Tournament</div>
      <div style="padding:14px;background:var(--surface);border-radius:var(--radius);">
        <div style="font-weight:600;">Junior National Football Championship 2024</div>
        <div style="font-size:13px;color:var(--muted);margin-top:4px;">Dec 15–17, 2024 • Bangalore</div>
      </div>
    </div>
    <div class="form-section">
      <div class="section-title">Select Category</div>
      <div class="category-select">
        <label class="category-option selected">
          <input type="radio" name="category" checked>
          <div>
            <div style="font-weight:600;">U-16</div>
            <div style="font-size:13px;color:var(--muted);">Age: 14–16 years • Born 2008–2010</div>
          </div>
          <div style="font-weight:600;">₹2,500</div>
        </label>
        <label class="category-option">
          <input type="radio" name="category">
          <div>
            <div style="font-weight:600;">U-18</div>
            <div style="font-size:13px;color:var(--muted);">Age: 16–18 years • Born 2006–2008</div>
          </div>
          <div style="font-weight:600;">₹2,500</div>
        </label>
      </div>
    </div>
    <div class="form-section">
      <div class="section-title">Team Details</div>
      <div class="form-group">
        <label>Team Name</label>
        <input type="text" value="Rising Stars FC">
      </div>
      <div class="form-group">
        <label>Team Manager / Contact Person</label>
        <input type="text" value="Vikram Singh">
      </div>
      <div class="form-group">
        <label>Contact Number</label>
        <input type="tel" value="+91 98765 43210">
      </div>
      <div class="form-group">
        <label>Number of Players</label>
        <select>
          <option>18</option>
          <option>19</option>
          <option>20</option>
          <option>21</option>
          <option>22</option>
        </select>
      </div>
    </div>
    <div class="form-section">
      <div class="section-title">Player Details</div>
      <div class="form-group">
        <label>Captain Name</label>
        <input type="text" value="Arjun Mehta">
      </div>
      <div class="form-group">
        <label>Coach Name</label>
        <input type="text" value="Raj Kapoor">
      </div>
    </div>
    <div class="fee-note">
      <strong>Note:</strong> Payment of ₹2,500 to be made via UPI/Net Banking. You will receive payment instructions after registration.
    </div>
  </div>
  <div class="cta-bar">
    <button class="btn-primary" onclick="location.href='registration-confirmation.html'">Submit Registration</button>
  </div>
</body>
</html>
