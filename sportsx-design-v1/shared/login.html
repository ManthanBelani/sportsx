<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Log In - SportX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 44px;
      padding-top: var(--safe-top);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 24px;
      padding-right: 24px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-icons {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .status-icons svg {
      width: 16px;
      height: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      border: none;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg);
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
    }

    .main-content {
      flex: 1;
      padding: 24px 20px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-area h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .logo-area p {
      font-size: 14px;
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      font-family: inherit;
      background: var(--bg);
      color: var(--fg);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-group input::placeholder {
      color: var(--muted);
    }

    .phone-input {
      display: flex;
      gap: 8px;
    }

    .phone-input .country-code {
      width: 70px;
      padding: 14px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      background: var(--surface);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-input input {
      flex: 1;
    }

    .forgot {
      text-align: right;
      margin-bottom: 16px;
    }

    .forgot a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-size: 13px;
      color: var(--muted);
    }

    .social-btns {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      color: var(--fg);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    .signup-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--muted);
    }

    .signup-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .method-toggle {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 4px;
      margin-bottom: 20px;
    }

    .method-option {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
    }

    .method-option.active {
      background: var(--bg);
    }
  </style>
</head>
<body>
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <i data-lucide="wifi"></i>
      <i data-lucide="radio"></i>
      <i data-lucide="battery-full"></i>
    </div>
  </div>

  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <i data-lucide="arrow-left"></i>
    </button>
    <h1>Log In</h1>
  </div>

  <div class="main-content">
    <div class="logo-area">
      <h1>SportX India</h1>
      <p>Welcome back! Log in to continue</p>
    </div>

    <div class="method-toggle">
      <div class="method-option active">Phone</div>
      <div class="method-option">Email</div>
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <div class="phone-input">
        <div class="country-code">+91</div>
        <input type="tel" placeholder="98765 43210" value="98765 43210">
      </div>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Enter your password">
    </div>

    <div class="forgot"><a href="#">Forgot Password?</a></div>
    <button class="btn-primary" onclick="location.href='../home-dashboard.html'">Log In</button>

    <div class="divider"><span>or continue with</span></div>

    <div class="social-btns">
      <button class="social-btn">
        <i data-lucide="mail"></i>
        Google
      </button>
      <button class="social-btn">
        <i data-lucide="smartphone"></i>
        Apple
      </button>
    </div>

    <div class="signup-link">Don't have an account? <a href="sign-up.html">Sign up</a></div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
