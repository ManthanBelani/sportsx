<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportX India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }
    .status-bar { height: 44px; padding-top: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding-left: 24px; padding-right: 24px; font-size: 14px; font-weight: 600; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 18px; font-weight: 600; }
    .close-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface); cursor: pointer; font-size: 18px; }
    .main-content { flex: 1; padding: 20px; overflow-y: auto; }
    .filter-section { margin-bottom: 24px; }
    .filter-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .sport-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; font-weight: 500; background: var(--bg); cursor: pointer; }
    .chip.active { background: var(--accent); color: white; border-color: var(--accent); }
    .chip.selected { background: var(--surface); border-color: var(--accent); color: var(--accent); }
    .range-input { display: flex; gap: 12px; align-items: center; }
    .range-input input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; }
    .range-input span { color: var(--muted); }
    .slider-container { padding: 8px 0; }
    .slider-track { height: 4px; background: var(--border); border-radius: 2px; position: relative; }
    .slider-fill { position: absolute; height: 100%; background: var(--accent); border-radius: 2px; width: 60%; left: 0; }
    .slider { width: 100%; height: 4px; appearance: none; background: transparent; position: absolute; top: 0; left: 0; }
    .slider::-webkit-slider-thumb { appearance: none; width: 20px; height: 20px; background: var(--accent); border-radius: 50%; cursor: pointer; }
    .age-group { display: flex; gap: 8px; }
    .age-btn { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-weight: 500; background: var(--bg); cursor: pointer; text-align: center; }
    .age-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .date-input { display: flex; gap: 8px; }
    .date-input input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; }
    .clear-btn { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-weight: 500; background: var(--bg); cursor: pointer; margin-bottom: 12px; }
    .apply-btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span>📶 📡 🔋</span></div>
  <div class="header">
    <h1>Filters</h1>
    <button class="close-btn" onclick="history.back()">×</button>
  </div>
  <div class="main-content">
    <div class="filter-section">
      <div class="filter-title">Sport</div>
      <div class="sport-chips">
        <div class="chip active">All Sports</div>
        <div class="chip selected">Football</div>
        <div class="chip">Basketball</div>
        <div class="chip">Cricket</div>
        <div class="chip">Athletics</div>
        <div class="chip">Swimming</div>
        <div class="chip">Tennis</div>
        <div class="chip">Badminton</div>
      </div>
    </div>
    <div class="filter-section">
      <div class="filter-title">Location</div>
      <div class="range-input">
        <input type="text" placeholder="City" value="Bangalore">
        <input type="text" placeholder="State" value="Karnataka">
      </div>
    </div>
    <div class="filter-section">
      <div class="filter-title">Fee Range (per month)</div>
      <div class="slider-container">
        <div class="slider-track">
          <div class="slider-fill"></div>
        </div>
        <input type="range" class="slider" min="0" max="50000" value="30000">
      </div>
      <div class="range-input">
        <input type="text" placeholder="Min" value="₹0">
        <span>to</span>
        <input type="text" placeholder="Max" value="₹30,000">
      </div>
    </div>
    <div class="filter-section">
      <div class="filter-title">Age Group</div>
      <div class="age-group">
        <div class="age-btn">5-8</div>
        <div class="age-btn">8-12</div>
        <div class="age-btn active">12-16</div>
        <div class="age-btn">16-20</div>
        <div class="age-btn">20+</div>
      </div>
    </div>
    <div class="filter-section">
      <div class="filter-title">Date Range</div>
      <div class="date-input">
        <input type="date" value="2024-11-01">
        <input type="date" value="2024-12-31">
      </div>
    </div>
    <div class="filter-section">
      <div class="filter-title">Gender</div>
      <div class="age-group">
        <div class="age-btn active">All</div>
        <div class="age-btn">Boys</div>
        <div class="age-btn">Girls</div>
      </div>
    </div>
    <div class="filter-section">
      <div class="filter-title">Rating</div>
      <div class="age-group">
        <div class="age-btn active">All</div>
        <div class="age-btn">4+ ★</div>
        <div class="age-btn">3+ ★</div>
      </div>
    </div>
  </div>
  <div style="padding:16px 20px;padding-bottom:calc(16px + var(--safe-bottom));border-top:1px solid var(--border);">
    <button class="clear-btn">Clear All Filters</button>
    <button class="apply-btn" onclick="history.back()">Apply Filters (24 results)</button>
  </div>
</body>
</html>
