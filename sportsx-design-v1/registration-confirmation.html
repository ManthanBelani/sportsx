<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Registration Confirmed - SportX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      background: #d1fae5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: #059669;
    }

    .success-icon svg {
      width: 40px;
      height: 40px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      color: var(--fg);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .details-card {
      width: 100%;
      max-width: 320px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      text-align: left;
      margin-bottom: 32px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-row .icon {
      width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .detail-row .icon svg {
      width: 18px;
      height: 18px;
    }

    .detail-row .content {
      flex: 1;
    }

    .detail-row .label {
      font-size: 12px;
      color: var(--muted);
    }

    .detail-row .value {
      font-size: 14px;
      font-weight: 500;
      color: var(--fg);
    }

    .registration-id {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #e6f0ff;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .registration-id svg {
      width: 14px;
      height: 14px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .action-btn svg {
      width: 18px;
      height: 18px;
    }

    .action-btn.primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
    }

    .action-btn.primary:active {
      background: var(--fg);
    }

    .action-btn.secondary {
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
    }

    .action-btn.secondary:active {
      background: var(--border);
    }

    .done-btn {
      width: 100%;
      padding: 16px;
      background: var(--fg);
      color: #ffffff;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      font-family: inherit;
    }

    .done-btn:active {
      background: #111111;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon">
      <i data-lucide="check-circle"></i>
    </div>
    <h1 class="title">Registration Confirmed!</h1>
    <p class="subtitle">You're all set for the trial</p>

    <div class="registration-id">
      <i data-lucide="hash"></i>
      Registration ID: #TR20260815
    </div>

    <div class="details-card">
      <div class="detail-row">
        <span class="icon">
          <i data-lucide="circle-dot"></i>
        </span>
        <div class="content">
          <div class="label">Event</div>
          <div class="value">U-14 Cricket Trials</div>
        </div>
      </div>
      <div class="detail-row">
        <span class="icon">
          <i data-lucide="calendar"></i>
        </span>
        <div class="content">
          <div class="label">Date & Time</div>
          <div class="value">Sat, Aug 15, 2026 · 7:00 AM</div>
        </div>
      </div>
      <div class="detail-row">
        <span class="icon">
          <i data-lucide="map-pin"></i>
        </span>
        <div class="content">
          <div class="label">Venue</div>
          <div class="value">Sardar Patel Stadium, Ahmedabad</div>
        </div>
      </div>
      <div class="detail-row">
        <span class="icon">
          <i data-lucide="user"></i>
        </span>
        <div class="content">
          <div class="label">Participant</div>
          <div class="value">Aryan Patel</div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="action-btn primary">
        <i data-lucide="bell"></i>
        Remind me before the event
      </button>
      <button class="action-btn secondary">
        <i data-lucide="calendar-plus"></i>
        Add to Calendar
      </button>
    </div>

    <button class="done-btn" onclick="window.location.href='home-dashboard.html'">
      Done
    </button>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
