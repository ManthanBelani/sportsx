<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Poppins', sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    h2 { color: #FFC800; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, select { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 8px; font-size: 14px; }
    button { background: #FFC800; color: #111; font-weight: 700; padding: 14px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    button:hover { filter: brightness(0.95); }
  </style>
</head>
<body>
  <h2>SportX Registration</h2>
  <form id="sportxForm">
    <div class="form-group">
      <label>Category *</label>
      <select id="category" required>
        <option value="">Select category</option>
        <option>Athlete</option>
        <option>Coach</option>
        <option>Academy</option>
        <option>Organizer</option>
        <option>Sponsor</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" id="name" placeholder="Enter your full name" required>
    </div>
    <div class="form-group">
      <label>Phone Number *</label>
      <input type="tel" id="phone" placeholder="Enter your phone number" required>
    </div>
    <div class="form-group">
      <label>Email (Optional)</label>
      <input type="email" id="email" placeholder="Enter your email">
    </div>
    <div class="form-group">
      <label>City *</label>
      <input type="text" id="city" placeholder="Enter your city" required>
    </div>
    <button type="submit">Submit</button>
  </form>
  <script>
    document.getElementById('sportxForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        city: document.getElementById('city').value,
        category: document.getElementById('category').value
      };
      document.querySelector('button').textContent = 'Submitting...';
      google.script.run
        .withSuccessHandler(function(response) {
          document.querySelector('button').textContent = 'Submitted Successfully!';
          document.getElementById('sportxForm').reset();
          setTimeout(function() { document.querySelector('button').textContent = 'Submit'; }, 3000);
        })
        .withFailureHandler(function(error) {
          document.querySelector('button').textContent = 'Error - Try Again';
          console.error(error);
        })
        .processForm(formData);
    });
  </script>
</body>
</html>
