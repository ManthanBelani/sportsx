<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SportX v3 — Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css" />
<style>.phone a.tap { color: inherit; text-decoration: none; }</style>
</head>
<body>
<div class="app-shell"><div class="phone">

  <div class="topbar">
    <a class="tap icon-tap" href="home.html">←</a>
    <div class="topbar-title">Notifications</div>
    <div class="top-actions"><div class="topbar-spacer"></div></div>
  </div>

  <!-- No bottom nav on this screen (matches prototype). EDIT: duplicate .notification-row to add items -->
  <main class="page">
    <div class="tabs"><div class="tap tab-active">All</div><div class="tap" data-toast="Opportunities — Phase 2">Opportunities</div><div class="tap" data-toast="System — Phase 2">System</div></div>
    <div class="notification-row"><i>👤</i><div><strong>Karan Joshi joined your academy</strong><span>10 min</span></div><b></b></div>
    <div class="notification-row"><i>👥</i><div><strong>Ahmedabad Cricket Academy followed you</strong><span>45 min</span></div><b></b></div>
    <div class="notification-row"><i>✉</i><div><strong>New enquiry for training program</strong><span>1 hr</span></div><b></b></div>
    <div class="notification-row"><i>🏆</i><div><strong>Priya Sharma registered for U-16 trial</strong><span>3 hr</span></div><b></b></div>
    <div class="notification-row"><i>★</i><div><strong>You received a new 5-star review</strong><span>Yesterday</span></div><b></b></div>
  </main>

</div></div>
<div class="toast" id="toast" style="display:none"></div>
<script>
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},1800)}
document.addEventListener('click',function(e){var t=e.target.closest('[data-toast]');if(t){showToast(t.getAttribute('data-toast'))}});
</script>
</body>
</html>
