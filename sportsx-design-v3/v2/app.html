<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SportX v3.2 — Full MVP Prototype · 129 screens · 6 roles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css" />
<style>
  /* v2 extensions — tokens inherited from ../styles.css, no new palette */
  .rolebar{position:sticky;top:64px;z-index:19;background:#111;color:#fff;display:flex;gap:6px;align-items:center;padding:8px 12px;overflow-x:auto;scrollbar-width:none}
  .rolebar select{background:#222;color:#fff;border:1px solid #444;border-radius:9px;font-size:11px;font-weight:700;padding:7px 9px}
  .rolebar .rid{font:800 10px "Sora";background:var(--yellow);color:#111;border-radius:7px;padding:5px 8px;white-space:nowrap}
  .rolebar .pri{font-size:9px;font-weight:800;border-radius:99px;padding:4px 8px;white-space:nowrap}
  .pri.p0{background:#dcfce7;color:#15803d}.pri.p1{background:#e3efff;color:#1d4ed8}.pri.p2{background:#f3f4f6;color:#6b7280}
  .rolebar a{color:var(--yellow);font-size:10px;font-weight:700;white-space:nowrap}
  .auth-wrap{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:12px}
  .auth-logo{text-align:center;padding:26px 0 6px}
  .auth-logo .logo{font-size:34px}
  .tagline{text-align:center;font:800 12px "Sora";letter-spacing:3px;color:var(--secondary)}
  .card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .field{margin:10px 0}
  .field label{display:block;font-size:10px;font-weight:700;color:var(--secondary);margin-bottom:6px}
  .input{min-height:46px;display:flex;align-items:center;gap:8px;background:var(--white);border:1.5px solid var(--border);border-radius:13px;padding:0 14px;font-size:12px;color:var(--secondary)}
  .input b{color:var(--ink)}.input input{border:0;outline:0;flex:1;font-size:12px}
  .otp-row{display:flex;gap:8px;justify-content:center;margin:14px 0}
  .otp{width:44px;height:52px;border:1.5px solid var(--border);border-radius:12px;display:grid;place-items:center;font:800 18px "Sora";background:#fff}
  .otp.fill{border-color:var(--yellow-deep);background:var(--yellow-soft)}
  .check-row{display:flex;gap:9px;align-items:flex-start;font-size:11px;color:var(--secondary)}
  .check{width:20px;height:20px;border-radius:6px;background:var(--yellow);display:grid;place-items:center;color:#111;font-size:12px;font-weight:800;flex:0 0 auto}
  .btn-row{display:flex;gap:8px;margin-top:12px}
  .btn-row .primary{flex:1}
  .ghost{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 18px;border-radius:14px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:700;flex:1}
  .or{display:flex;align-items:center;gap:10px;color:var(--tertiary);font-size:10px;margin:12px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--border)}
  .steps{font-size:10px;color:var(--secondary);margin-bottom:8px}
  .sheet{background:#fff;border-radius:20px 20px 0 0;padding:14px 16px 22px;box-shadow:var(--shadow-up)}
  .handle{width:44px;height:5px;border-radius:99px;background:var(--border);margin:0 auto 12px}
  .bubble{max-width:78%;padding:10px 13px;border-radius:14px;font-size:11px;line-height:1.5}
  .bubble.me{background:var(--yellow-soft);border:1px solid #f0e3b2;margin-left:auto;border-bottom-right-radius:4px}
  .bubble.them{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
  .chat-day{text-align:center;font-size:9px;color:var(--tertiary);margin:12px 0}
  .chat-input{position:sticky;bottom:0;display:flex;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--border)}
  .tbl{width:100%;border-collapse:collapse;font-size:10px}
  .tbl th{text-align:left;color:var(--secondary);font-size:9px;padding:8px;border-bottom:1px solid var(--border)}
  .tbl td{padding:9px 8px;border-bottom:1px solid var(--border-soft)}
  .bar{height:8px;border-radius:99px;background:#edeff2;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--yellow)}
  .bar.g i{background:var(--green)}.bar.b i{background:var(--blue)}
  .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;text-align:center;margin:12px 0}
  .podium .p{background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 4px}
  .podium .p.first{background:linear-gradient(#fff,var(--yellow-light));border-color:#f0e3b2}
  .admin-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
  .admin-tabs a{font-size:10px;font-weight:700;padding:8px 12px;border-radius:99px;border:1px solid var(--border);background:#fff;color:var(--secondary);text-decoration:none;white-space:nowrap}
  .admin-tabs a.on{background:#111;color:#fff;border-color:#111}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px}
  .kpi strong{font:800 20px "Sora"}.kpi span{font-size:9px;color:var(--secondary)}
  .note{font-size:10px;color:var(--secondary);background:var(--yellow-soft);border:1px solid #f0e3b2;border-radius:12px;padding:10px 12px;margin:10px 0}
  .prog-list .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:11px}
  .prog-list .row:last-child{border:0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
  .top-back{display:flex;align-items:center;gap:10px}
  .flow-nav{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--border);scrollbar-width:none}
  .flow-nav a{font-size:10px;font-weight:700;color:var(--secondary);text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:99px;border:1px solid var(--border)}
  .flow-nav a.on{color:#111;background:var(--yellow-light);border-color:#f0e3b2}
  .pilltabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .pilltab{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid var(--border);font-size:11px;font-weight:600;color:var(--secondary);white-space:nowrap}
  .pilltab.on{background:var(--yellow);border-color:var(--yellow-deep);color:#111;font-weight:800}
  .dropchips{display:flex;gap:8px;overflow-x:auto;margin:10px 0;scrollbar-width:none}
  .dropchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:11px;background:#fff;border:1px solid var(--border);font-size:11px;color:var(--secondary);white-space:nowrap}
  .agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .acard{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .acard .ph{position:relative;height:128px}.acard .ph img{width:100%;height:100%;object-fit:cover}
  .acard .bkm{position:absolute;top:8px;right:8px;width:28px;height:28px;display:grid;place-items:center;background:rgba(255,255,255,.92);border-radius:8px;color:var(--secondary)}
  .acard .bd{padding:9px 10px 10px}.acard .bd strong{font-size:11px;display:flex;align-items:center;gap:3px}
  .acard .bd p{margin:3px 0;font-size:9px;color:var(--secondary)}
  .acard .meta{display:flex;align-items:center;gap:8px;font-size:9px;color:var(--secondary);margin:5px 0 8px}
  .acard .primary{width:100%;min-height:34px;font-size:10px}
  .ctile{display:flex;gap:12px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .ctile .ci{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto}
  .ctile strong{font-size:12px}.ctile p{margin:3px 0 0;font-size:9px;color:var(--secondary);line-height:1.5}
  .tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tilegrid .ctile{align-items:flex-start}
  .tilegrid .ctile .chev{margin-left:auto}
  .qpost{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
  .qpost div{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 4px;text-align:center;font-size:9px;font-weight:600}
  .rail{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .rail .acard{flex:0 0 150px}
  .evdate{position:absolute;left:8px;top:8px;background:var(--yellow);border-radius:10px;text-align:center;padding:5px 9px}
  .evdate b{display:block;font:800 15px "Sora";line-height:1}.evdate span{font-size:8px;font-weight:800}
  .typechip{display:inline-block;font-size:8px;font-weight:800;border-radius:6px;padding:3px 8px;background:#dcfce7;color:#15803d}
  .stathead{background:linear-gradient(140deg,#fff,var(--yellow-soft));border:1px solid #f0e3b2;border-radius:18px;padding:14px}
  .stathead .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;text-align:center}
  .stathead .row3 b{font:800 16px "Sora"}.stathead .row3 span{font-size:9px;color:var(--secondary)}
  .mrow{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:9px;box-shadow:var(--shadow)}
  .mrow .mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
  .mrow b{font-size:12px}.mrow p{margin:2px 0 0;font-size:9px;color:var(--secondary)}
  .mrow .chev{margin-left:auto;color:var(--tertiary);align-self:center}
  .podium3{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;align-items:end;text-align:center;margin:12px 0}
  .podium3 .p{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 6px}
  .podium3 .p.w{background:linear-gradient(#fff,var(--yellow-light));border-color:var(--yellow-deep)}
  .podium3 img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--yellow)}
  .podium3 b{font-size:10px}.podium3 small{color:var(--secondary);font-size:8px}
  .medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font:800 12px "Sora";color:#fff;background:#9ca3af}
  .medal.g{background:#F5B400;color:#111}.medal.b{background:#D97706}
  .strip5{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;text-align:center}
  .strip5 div{flex:0 0 62px}.strip5 img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--yellow)}
  .strip5 b{font-size:8px;display:block}.strip5 span{font-size:8px;color:var(--secondary)}
  .rnk{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--yellow);font:800 10px "Sora"}
  .subtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}
  .subtiles div{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:7px 2px;font-size:8px;color:var(--secondary)}
  .feedtabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:12px 0;overflow-x:auto;scrollbar-width:none}
  .feedtabs span{flex:0 0 auto;padding:10px 10px 9px;color:var(--secondary);font-size:10px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
  .feedtabs span.on{color:var(--ink);border-bottom-color:var(--yellow);font-weight:800}
  .sh{font-size:8px;font-weight:800;color:#111;background:#fff;border-radius:6px;padding:4px 7px;white-space:nowrap}
  .sh.only{background:transparent;color:#bbb;border:1px solid #444}
  @media (max-width:600px){.rolebar{top:64px}}
</style>
</head>
<body>
<div class="app-shell"><div class="phone" id="phone"></div>
<div class="toast" id="toast" style="display:none"></div>
</div>
<script>
/* ============ SportX v3.2 — full MVP prototype ============
   Design system: ../styles.css tokens (yellow gradient CTA, Sora+Inter, 430px phone).
   Layouts: faithful to new_design_docs wireframes (A/S/D/AT/CO/AC/OR/SC/AD).
   Hash: #a1 #at1 #co2 #ac2 #or2 #sc2 #ad2 #s2 #d6 ... (lowercase, no dot) */
const P = {
  cricket:"https://images.unsplash.com/photo-1732315797079-fe90763b8bd9?auto=format&fit=crop&w=900&q=82",
  football:"https://images.unsplash.com/photo-1625990637351-ee0e5e9ba5e5?auto=format&fit=crop&w=900&q=82",
  player:"https://images.unsplash.com/photo-1547839918-5ed99eac4175?auto=format&fit=crop&w=700&q=82",
  stadium:"https://images.unsplash.com/photo-1644664750583-1cf0430098ff?auto=format&fit=crop&w=900&q=82"
};
const PEOPLE = [
  {n:"Arjun Patel",r:"Cricket · All-rounder",img:P.player},
  {n:"Priya Sharma",r:"State Level Athlete",img:P.football},
  {n:"Karan Joshi",r:"Cricket · Batter",img:P.cricket},
  {n:"Neha Patel",r:"Football · Striker",img:P.stadium}
];
const I = {
  home:'<path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-7h6v7"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4 4-2Z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
  message:'<path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>', chev:'<path d="m9 18 6-6-6-6"/>', arrow:'<path d="m15 18-6-6 6-6"/>',
  star:'<path d="m12 2 3 6 7 .9-5 4.8 1.3 6.8-6.3-3.3-6.3 3.3L7 13.7 2 9l7-.9L12 2Z"/>',
  map:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M7 6H3v2a4 4 0 0 0 4 4M17 6h4v2a4 4 0 0 1-4 4"/>',
  bkm:'<path d="M6 3h12v18l-6-4-6 4V3Z"/>', share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',
  acad:'<path d="m3 10 9-6 9 6"/><path d="M5 10v9h14v-9M9 19v-5h6v5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  chart:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>', shield:'<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/>'
};
const ic=(n,s)=>'<svg class="icon" width="'+(s||20)+'" height="'+(s||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+I[n]+"</svg>";
let ROLE = localStorage.getItem("sx_role")||"athlete";
const ROLES={athlete:"Athlete",coach:"Coach",academy:"Academy",organizer:"Organizer",scout:"Scout",admin:"Admin"};
const HOME={athlete:"at1",coach:"co2",academy:"ac2",organizer:"or2",scout:"sc2",admin:"ad2"};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",1800)}
function go(h){location.hash=h}
/* ----- shared chrome ----- */
function topbar(o){o=o||{};let l=o.back?'<div class="tap icon-tap" data-go="'+(o.backTo||HOME[ROLE])+'">'+ic("arrow")+'</div>':o.title?'<div class="topbar-spacer"></div>':'<div class="logo">Sport<span>X</span><i></i></div>';
let r='<div class="top-actions">';if(o.msg)r+='<div class="tap icon-tap" data-go="s17">'+ic("message",18)+'</div>';if(o.bell)r+='<div class="tap icon-tap notification-button" data-go="s16">'+ic("bell",18)+'<b>3</b></div>';
if(!o.back&&!o.title)r+='<img class="avatar avatar-small" src="'+PEOPLE[0].img+'" data-go="d1" style="cursor:pointer" alt=""/>';if(o.back&&!o.bell)r+='<div class="topbar-spacer"></div>';return '<div class="topbar">'+l+(o.title?'<div class="topbar-title">'+o.title+'</div>':"")+r+'</div></div>'}
function sharedTag(id){const p=id.split(".")[0];if(p==="A"||p==="S"||p==="D")return["SHARED · ALL ROLES",1];if(["OR.5","OR.6","OR.7","OR.8"].indexOf(id)>=0)return["EVENT MODULE · ORG+ACD+COA",1];if(id==="CO.5")return["PROGRAM FORM · COA+ACD",1];if(p==="AT")return["ATHLETE ONLY",0];if(p==="CO")return["COACH ONLY",0];if(p==="AC")return["ACADEMY ONLY",0];if(p==="OR")return["ORGANIZER ONLY",0];if(p==="SC")return["SCOUT ONLY",0];if(p==="AD")return["ADMIN ONLY",0];return["",0]}
function rolebar(id,pri){const st=sharedTag(id);return '<div class="rolebar"><select id="roleSel">'+Object.keys(ROLES).map(k=>'<option value="'+k+'"'+(k===ROLE?" selected":"")+'>'+ROLES[k]+'</option>').join("")+'</select><span class="rid">'+id+'</span>'+(st[0]?'<span class="sh'+(st[1]?"":" only")+'">'+st[0]+'</span>':"")+'<span class="pri '+pri.toLowerCase()+'">'+pri+'</span><a href="index.html">All screens</a></div>'}
function bottomNav(active){if(ROLE==="admin")return '<div class="bottom-nav">'+[["Dash","ad2","home"],["Users","ad3","users"],["Verif.","ad4","shield"],["Content","ad5","grid"],["More","ad2","grid"]].map(x=>'<div class="tap nav-item'+(active===x[1]?" nav-active":"")+'" data-go="'+x[1]+'"><div class="nav-icon">'+ic(x[2],20)+'</div><span>'+x[0]+'</span></div>').join("")+'</div>';
const items=[["Home",HOME[ROLE],"home"],["Explore","s2","compass"],["Create","s8","plus"],["Community","s12","users"],["More","s15","grid"]];let a=active;if(["d1","d2","d3","d4","d5","co4","co5","ac4","ac6","ac7","or4","or6","sc5","at8","at9"].includes(active))a="s15";
return '<div class="bottom-nav">'+items.map(x=>'<div class="tap nav-item'+(a===x[1]?" nav-active":"")+(x[1]==="s8"?" create-nav":"")+'" data-go="'+x[1]+'"><div class="nav-icon">'+ic(x[2],x[1]==="s8"?24:20)+'</div><span>'+x[0]+'</span></div>').join("")+'</div>'}
function page(id,pri,title,back,inner,opts){opts=opts||{};const nonav=["s16","s17","s18","d6","d9","a1","a2","a3","a4","a5","ad1"].includes(id);
return rolebar(id,pri)+topbar({title:title,back:back,backTo:opts.backTo,bell:opts.bell,msg:opts.msg})+'<main class="page'+(back?" subpage":"")+'">'+inner+'</main>'+(nonav?"":bottomNav(id))+(opts.sticky?'<div class="sticky-action">'+opts.sticky+'</div>':"")}
const primary=(t,go2)=>'<div class="tap primary" '+(go2?'data-go="'+go2+'"':'data-toast="'+t+'"')+'>'+t+'</div>';
const chip=(t,on,go2)=>'<div class="tap chip'+(on?" chip-active":"")+'" '+(go2?'data-go="'+go2+'"':'data-toast="'+t+'"')+'>'+t+'</div>';
const search=(ph)=>'<div class="search">'+ic("search",18)+'<span>'+(ph||"Search athletes, sport, city")+'</span></div>';

const TITLES={};
function render(){let h=(location.hash||"#"+HOME[ROLE]).replace("#","").toLowerCase();if(!VIEWS[h])h=HOME[ROLE];
