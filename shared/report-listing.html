<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportX India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }
    .status-bar { height: 44px; padding-top: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding-left: 24px; padding-right: 24px; font-size: 14px; font-weight: 600; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 18px; font-weight: 600; }
    .close-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface); cursor: pointer; font-size: 18px; }
    .main-content { flex: 1; padding: 20px; }
    .listing-preview { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; display: flex; gap: 12px; align-items: center; }
    .listing-img { width: 60px; height: 60px; border-radius: var(--radius); object-fit: cover; }
    .listing-info h4 { font-size: 15px; font-weight: 600; }
    .listing-info p { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
    .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-family: inherit; background: var(--bg); }
    .form-group textarea { resize: none; height: 100px; }
    .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; }
    .checkbox-group input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
    .checkbox-group label { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .cta-bar { padding: 16px 20px; padding-bottom: calc(16px + var(--safe-bottom)); border-top: 1px solid var(--border); display: flex; gap: 12px; }
    .btn-secondary { flex: 1; padding: 14px; background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { flex: 1; padding: 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span>📶 📡 🔋</span></div>
  <div class="header">
    <h1>Report Listing</h1>
    <button class="close-btn" onclick="history.back()">×</button>
  </div>
  <div class="main-content">
    <div class="listing-preview">
      <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=120&h=120&fit=crop" alt="Listing" class="listing-img">
      <div class="listing-info">
        <h4>Sunrise Football Academy</h4>
        <p>Indiranagar, Bangalore • Football</p>
      </div>
    </div>
    <div class="form-group">
      <label>Reason for reporting</label>
      <select>
        <option value="">Select a reason</option>
        <option>Fake or fraudulent listing</option>
        <option>Inappropriate content</option>
        <option>Incorrect contact information</option>
        <option>Duplicate listing</option>
        <option>Pricing mismatch</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Additional details (optional)</label>
      <textarea placeholder="Provide any additional context that will help us investigate..."></textarea>
    </div>
    <div class="checkbox-group">
      <input type="checkbox" id="evidence">
      <label for="evidence">I confirm this report is made in good faith and I have evidence to support this claim.</label>
    </div>
  </div>
  <div class="cta-bar">
    <button class="btn-secondary" onclick="history.back()">Cancel</button>
    <button class="btn-primary" onclick="alert('Report submitted. Thank you for helping keep SportX safe.')">Submit Report</button>
  </div>
</body>
</html>
