:root[data-theme="dark"]{--pg:#16161a;--pgt:#f2f2f2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--pg);color:var(--pgt);font-family:Inter,"SF Pro Text","Segoe UI",system-ui,sans-serif;padding:20px 10px 40px}
h1{text-align:center;font-size:20px;font-weight:800;margin-bottom:18px}
.board{display:flex;flex-wrap:wrap;gap:26px 14px;justify-content:center;max-width:1760px;margin:auto}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.lb{background:var(--y);color:#111;font-weight:800;font-size:15px;padding:7px 22px;border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}

.isl{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:84px;height:22px;background:#0b0b0f;border-radius:14px;z-index:3}
.sb{height:36px;padding:10px 20px 0;display:flex;justify-content:space-between;font-weight:700;font-size:10px;flex:none;align-items:center}
.bd{flex:1;overflow-y:auto;padding:0 12px 10px;scrollbar-width:none}.bd::-webkit-scrollbar{display:none}
.h{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px;min-height:38px}
.h .t{font-size:15px;font-weight:700;flex:1;text-align:center}.h .s{width:24px;display:flex;justify-content:center;gap:6px}
.logo{font-size:21px;font-weight:900;letter-spacing:-.5px}.logo b{color:var(--y)}
.r{display:flex;align-items:center;gap:8px}.f1{flex:1;min-width:0}
.b{font-weight:700}.m{color:var(--mu);font-size:10px}.n{font-size:12px;font-weight:700}
.vf{display:inline-flex;width:12px;height:12px;border-radius:50%;background:var(--bl);color:#fff;font-size:8px;align-items:center;justify-content:center;vertical-align:1px}
.sr{background:var(--fd);border-radius:12px;padding:10px 12px;color:#8a93a3;display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:11px}
.chs{display:flex;gap:6px;margin-bottom:10px;overflow:hidden}
.ch{padding:6px 11px;border-radius:99px;background:var(--fd);color:#4b5563;font-weight:600;white-space:nowrap;font-size:10.5px;display:flex;gap:4px;align-items:center}
.ch.on{background:var(--y);color:#111}
.tb{display:flex;border-bottom:1px solid var(--ln);margin-bottom:10px}.tb div{flex:1;text-align:center;padding:8px 0;color:var(--mu);font-weight:600;font-size:10.5px}.tb .on{color:#111;border-bottom:2px solid var(--y)}
.btn{background:var(--y);color:#111;font-weight:700;font-size:10.5px;padding:6px 14px;border-radius:9px;white-space:nowrap;display:inline-flex;gap:4px;align-items:center;justify-content:center}
.bo{background:#fff;border:1px solid #dfe3ea;color:#374151}
.cd{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:center}
.tg{display:inline-block;background:var(--fd);color:#6b7280;border-radius:6px;padding:2px 7px;font-size:9px;margin-right:4px}
.st{color:var(--gd);font-weight:700;font-size:10px;display:flex;gap:2px;align-items:center}
.nv{display:flex;justify-content:space-around;align-items:flex-end;border-top:1px solid var(--ln);padding:6px 0 12px;flex:none;background:#fff}
.nv div{width:56px;text-align:center;font-size:8.5px;color:#4b5563;display:flex;flex-direction:column;align-items:center;gap:2px}
.nv .on{color:#c88a00;font-weight:700}
.nv .cr span{width:42px;height:42px;border-radius:50%;background:var(--y);display:flex;align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 4px 10px rgba(255,194,26,.55);color:#111}
.cre{display:flex;gap:12px;align-items:center;background:#f5f7fc;border-radius:14px;padding:11px;margin-bottom:8px}
.ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--ln);font-size:12px}
.li svg:last-child{margin-left:auto;color:#9ca3af}
.rk{position:absolute;top:-2px;left:-4px;width:17px;height:17px;border-radius:50%;background:var(--y);font-weight:800;font-size:9px;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.pod{display:flex;justify-content:space-around;align-items:flex-end;text-align:center}.pod>div{position:relative}
.ib{display:flex;gap:10px;font-size:11px;padding:6px 0;color:#374151;align-items:center}.ib span{width:112px;color:#4b5563;display:flex;gap:8px;align-items:center}
.bg{min-width:16px;height:16px;border-radius:99px;background:var(--y);font-weight:800;font-size:9px;display:flex;align-items:center;justify-content:center;margin:3px 0 0 auto}
