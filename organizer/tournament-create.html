<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportX India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }
    .status-bar { height: 44px; padding-top: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding-left: 24px; padding-right: 24px; font-size: 14px; font-weight: 600; }
    .header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 18px; font-weight: 600; }
    .back-btn { width: 40px; height: 40px; border-radius: var(--radius); border: none; background: var(--surface); cursor: pointer; font-size: 18px; }
    .main-content { flex: 1; padding: 20px; overflow-y: auto; }
    .form-section { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .form-section:last-child { border-bottom: none; }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-family: inherit; background: var(--bg); }
    .form-group textarea { resize: none; height: 80px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }
    .category-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .category-row input { flex: 1; }
    .category-row input:first-child { max-width: 120px; }
    .category-row .fee-input { max-width: 100px; }
    .category-row button { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); cursor: pointer; }
    .add-category { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 14px; font-weight: 500; cursor: pointer; padding: 8px 0; }
    .cta-bar { padding: 16px 20px; padding-bottom: calc(16px + var(--safe-bottom)); border-top: 1px solid var(--border); display: flex; gap: 12px; }
    .btn-secondary { flex: 1; padding: 14px; background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { flex: 1; padding: 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span>📶 📡 🔋</span></div>
  <div class="header">
    <button class="back-btn" onclick="history.back()">←</button>
    <h1>Create Tournament</h1>
  </div>
  <div class="main-content">
    <div class="form-section">
      <div class="section-title">Tournament Details</div>
      <div class="form-group"><label>Tournament Name</label><input type="text" value="State Level Athletics Meet 2025"></div>
      <div class="row">
        <div class="form-group"><label>Sport</label><select><option>Athletics</option><option>Football</option><option>Basketball</option></select></div>
        <div class="form-group"><label>Format</label><select><option>Knockout</option><option>League</option><option>Knockout + League</option></select></div>
      </div>
      <div class="row">
        <div class="form-group"><label>Start Date</label><input type="date" value="2025-01-05"></div>
        <div class="form-group"><label>End Date</label><input type="date" value="2025-01-07"></div>
      </div>
      <div class="form-group"><label>Venue</label><input type="text" value="Kanteerava Stadium, Bangalore"></div>
      <div class="form-group"><label>Description</label><textarea placeholder="Tournament format, rules, eligibility..."></textarea></div>
    </div>
    <div class="form-section">
      <div class="section-title">Prize Pool</div>
      <div class="row">
        <div class="form-group"><label>Total Prize Pool</label><input type="text" value="₹3,00,000"></div>
      </div>
      <div class="row">
        <div class="form-group"><label>1st Place</label><input type="text" value="₹1,50,000"></div>
        <div class="form-group"><label>2nd Place</label><input type="text" value="₹80,000"></div>
        <div class="form-group"><label>3rd Place</label><input type="text" value="₹40,000"></div>
      </div>
    </div>
    <div class="form-section">
      <div class="section-title">Entry Fee & Categories</div>
      <div class="row">
        <div class="form-group"><label>Entry Fee (per team/individual)</label><input type="text" value="₹3,000"></div>
        <div class="form-group"><label>Max Teams/Participants</label><input type="number" value="48"></div>
      </div>
      <div class="form-group"><label>Categories</label></div>
      <div class="category-row"><input type="text" placeholder="Category" value="U-16"><input type="text" placeholder="Age" value="14-16"><input type="text" placeholder="Fee" class="fee-input" value="₹3,000"><button>×</button></div>
      <div class="category-row"><input type="text" placeholder="Category" value="U-18"><input type="text" placeholder="Age" value="16-18"><input type="text" placeholder="Fee" class="fee-input" value="₹3,000"><button>×</button></div>
      <div class="category-row"><input type="text" placeholder="Category" value="Open"><input type="text" placeholder="Age" value="18+"><input type="text" placeholder="Fee" class="fee-input" value="₹3,500"><button>×</button></div>
      <div class="add-category">+ Add Category</div>
    </div>
    <div class="form-section">
      <div class="section-title">Registration Deadline</div>
      <div class="form-group"><label>Deadline Date</label><input type="date" value="2024-12-20"></div>
    </div>
  </div>
  <div class="cta-bar">
    <button class="btn-secondary">Save as Draft</button>
    <button class="btn-primary">Publish Tournament</button>
  </div>
</body>
</html>
