<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportX India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }
    .status-bar { height: 44px; padding-top: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding-left: 24px; padding-right: 24px; font-size: 14px; font-weight: 600; }
    .header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 18px; font-weight: 600; }
    .back-btn { width: 40px; height: 40px; border-radius: var(--radius); border: none; background: var(--surface); cursor: pointer; font-size: 18px; }
    .main-content { flex: 1; padding: 20px; }
    .tournament-info { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; }
    .tournament-info h2 { font-size: 16px; font-weight: 600; }
    .tournament-info p { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .section-title { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 12px; }
    .match-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .match-row:last-child { border-bottom: none; }
    .match-round { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .team-slot { flex: 1; padding: 12px; background: var(--surface); border-radius: var(--radius); text-align: center; font-size: 14px; font-weight: 500; }
    .team-slot.winner { background: #d1fae5; color: #065f46; }
    .team-slot.tbd { color: var(--muted); }
    .vs { font-size: 12px; color: var(--muted); font-weight: 600; }
    .result-input { width: 60px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); text-align: center; font-size: 14px; font-weight: 600; }
    .cta-bar { padding: 16px 20px; padding-bottom: calc(16px + var(--safe-bottom)); border-top: 1px solid var(--border); }
    .btn-primary { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span>📶 📡 🔋</span></div>
  <div class="header">
    <button class="back-btn" onclick="history.back()">←</button>
    <h1>Publish Results</h1>
  </div>
  <div class="main-content">
    <div class="tournament-info">
      <h2>Junior National Football Championship 2024</h2>
      <p>U-16 Semi Finals • Dec 16, 2024</p>
    </div>
    <div class="section-title">SEMI FINALS</div>
    <div class="match-row">
      <div class="match-round">Match 1 • Dec 16, 10:00 AM</div>
    </div>
    <div class="match-row" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <div class="team-slot winner">Rising Stars FC</div>
        <input type="text" class="result-input" value="3">
        <span class="vs">-</span>
        <input type="text" class="result-input" value="1">
        <div class="team-slot">Thunder United</div>
      </div>
    </div>
    <div class="match-row">
      <div class="match-round">Match 2 • Dec 16, 2:00 PM</div>
    </div>
    <div class="match-row" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <div class="team-slot tbd">TBD</div>
        <input type="text" class="result-input" placeholder="-">
        <span class="vs">-</span>
        <input type="text" class="result-input" placeholder="-">
        <div class="team-slot tbd">TBD</div>
      </div>
    </div>
    <div class="section-title" style="margin-top:24px;">QUARTER FINALS (COMPLETED)</div>
    <div class="match-row">
      <div class="match-round">Match 1 • Dec 15, 9:00 AM</div>
    </div>
    <div class="match-row" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="team-slot winner">Rising Stars FC</div>
        <div style="font-size:14px;font-weight:600;color:var(--accent);">2 - 0</div>
        <div class="team-slot">Falcons SC</div>
      </div>
    </div>
  </div>
  <div class="cta-bar">
    <button class="btn-primary">Publish Results</button>
  </div>
</body>
</html>
