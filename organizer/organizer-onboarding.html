<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Organizer Setup - SportX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 44px;
      padding-top: var(--safe-top);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 24px;
      padding-right: 24px;
      font-size: 14px;
      font-weight: 600;
    }

    .status-icons {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .status-icons svg {
      width: 16px;
      height: 16px;
    }

    .progress-bar {
      display: flex;
      padding: 16px 20px;
      gap: 8px;
    }

    .progress-step {
      flex: 1;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
    }

    .progress-step.completed {
      background: var(--accent);
    }

    .progress-step.active {
      background: var(--accent);
      opacity: 0.5;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius);
      border: none;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg);
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
    }

    .main-content {
      flex: 1;
      padding: 20px;
    }

    .step-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .step-subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
      color: var(--fg);
    }

    .form-group textarea {
      resize: none;
      height: 80px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-group input::placeholder {
      color: var(--muted);
    }

    .upload-area {
      padding: 24px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .upload-area:hover {
      border-color: var(--accent);
    }

    .upload-area .icon {
      color: var(--accent);
    }

    .upload-area .icon svg {
      width: 32px;
      height: 32px;
    }

    .upload-area p {
      font-size: 14px;
      color: var(--muted);
    }

    .upload-area strong {
      color: var(--accent);
    }

    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #d1fae5;
      color: #065f46;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 12px;
    }

    .verified-badge svg {
      width: 14px;
      height: 14px;
    }

    .cta-bar {
      padding: 16px 20px;
      padding-bottom: calc(16px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
    }

    .btn-secondary {
      flex: 1;
      padding: 14px;
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary {
      flex: 1;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <i data-lucide="wifi"></i>
      <i data-lucide="radio"></i>
      <i data-lucide="battery-full"></i>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-step completed"></div>
    <div class="progress-step active"></div>
  </div>

  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <i data-lucide="arrow-left"></i>
    </button>
    <h1>Organizer Setup</h1>
  </div>

  <div class="main-content">
    <div class="step-title">Organization Details</div>
    <div class="step-subtitle">Tell us about your organization</div>

    <div class="form-group">
      <label>Organization Name</label>
      <input type="text" value="Karnataka State Football Association">
    </div>

    <div class="form-group">
      <label>Organization Type</label>
      <select>
        <option>State Sports Association</option>
        <option>District Sports Association</option>
        <option>Private Sports Club</option>
        <option>School/College Sports Dept</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Registration Number</label>
      <input type="text" value="KSFA/REG/2020/0456">
    </div>

    <div class="form-group">
      <label>Website (optional)</label>
      <input type="text" placeholder="https://">
    </div>

    <div class="form-group">
      <label>Verification Documents</label>
      <div class="upload-area">
        <div class="icon">
          <i data-lucide="file-text"></i>
        </div>
        <p>Upload registration certificate or<br>any government ID for verification</p>
        <p style="margin-top:8px;"><strong>Click to upload</strong> or drag and drop</p>
        <p style="font-size:12px;margin-top:4px;">PDF, JPG up to 10MB</p>
      </div>
    </div>

    <div style="text-align:center;">
      <div class="verified-badge">
        <i data-lucide="check-circle"></i>
        Documents submitted for verification
      </div>
    </div>
  </div>

  <div class="cta-bar">
    <button class="btn-secondary" onclick="history.back()">Back</button>
    <button class="btn-primary" onclick="location.href='organizer-dashboard.html'">Continue</button>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
