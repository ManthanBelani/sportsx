<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportX India</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f8fa;
      --fg: #111111;
      --muted: #6b7280;
      --border: #d9dee7;
      --accent: #1677ff;
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }
    .status-bar { height: 44px; padding-top: var(--safe-top); display: flex; align-items: center; justify-content: space-between; padding-left: 24px; padding-right: 24px; font-size: 14px; font-weight: 600; }
    .header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .header h1 { font-size: 18px; font-weight: 600; }
    .back-btn { width: 40px; height: 40px; border-radius: var(--radius); border: none; background: var(--surface); cursor: pointer; font-size: 18px; }
    .main-content { flex: 1; padding: 20px; overflow-y: auto; }
    .sponsor-card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
    .sponsor-logo { width: 56px; height: 56px; border-radius: var(--radius); object-fit: cover; }
    .sponsor-info h3 { font-size: 16px; font-weight: 600; }
    .sponsor-info p { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .form-group textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; font-family: inherit; resize: none; height: 140px; }
    .form-group textarea:focus { outline: none; border-color: var(--accent); }
    .profile-preview { background: var(--surface); border-radius: var(--radius); padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .profile-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
    .profile-info h4 { font-size: 15px; font-weight: 600; }
    .profile-info p { font-size: 13px; color: var(--muted); }
    .info-text { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .cta-bar { padding: 16px 20px; padding-bottom: calc(16px + var(--safe-bottom)); border-top: 1px solid var(--border); }
    .btn-primary { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span>📶 📡 🔋</span></div>
  <div class="header">
    <button class="back-btn" onclick="history.back()">←</button>
    <h1>Apply to Sponsor</h1>
  </div>
  <div class="main-content">
    <div class="sponsor-card">
      <img src="https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=112&h=112&fit=crop" alt="Nike" class="sponsor-logo">
      <div class="sponsor-info">
        <h3>Nike India</h3>
        <p>Emerging Athletes Program 2024</p>
      </div>
    </div>
    <div class="form-group">
      <label>Your Profile (auto-attached)</label>
      <div class="profile-preview">
        <img src="https://images.unsplash.com/photo-1526232761682-d26e03ac148e?w=96&h=96&fit=crop" alt="Profile" class="profile-avatar">
        <div class="profile-info">
          <h4>Priya Sharma</h4>
          <p>Football • Age 16 • Bangalore</p>
        </div>
      </div>
      <div class="info-text">Your profile with achievements, sports, and media gallery will be shared with the sponsor.</div>
    </div>
    <div class="form-group">
      <label>Pitch Note (Why should Nike sponsor you?)</label>
      <textarea placeholder="Hi Nike, I'm Priya, a 16-year-old footballer from Bangalore. I've been playing for 6 years and recently won the Karnataka State U-18 Championship as captain. I train 4 days a week at Sreekanya Academy and dream of playing professionally. This sponsorship would help me access better equipment and training opportunities..."></textarea>
    </div>
    <div class="form-group">
      <label>Attach Additional Documents (optional)</label>
      <div style="padding:14px;border:2px dashed var(--border);border-radius:var(--radius);text-align:center;color:var(--muted);font-size:14px;cursor:pointer;">+ Upload Certificates / Achievements</div>
    </div>
  </div>
  <div class="cta-bar">
    <button class="btn-primary" onclick="alert('Application submitted successfully!')">Submit Application</button>
  </div>
</body>
</html>
